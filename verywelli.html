<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check Now</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .giveaway-card {
      width: 100%;
      max-width: 410px;
      padding: 40px 22px;
      border-radius: 26px;
      background: linear-gradient(145deg, #075735, #087444 60%, #00663d);
      box-shadow: 0 12px 32px rgba(0, 82, 46, 0.18);
      color: #ffffff;
    }

    .giveaway-card h1 {
      margin: 0 0 14px;
      font-size: clamp(21px, 5.8vw, 30px);
      font-weight: 700;
      line-height: 1.2;
    }

    .giveaway-message {
      margin: 0;
      font-size: clamp(16px, 3.8vw, 18px);
      font-weight: 700;
      line-height: 1.55;
    }

    .ryes-button {
      display: grid;
      place-items: center;
      min-height: 88px;
      margin: 32px 0 22px;
      padding: 16px;
      border-radius: 999px;
      background: #c51627;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: clamp(17px, 4.3vw, 23px);
      font-weight: 800;
      line-height: 1.25;
    }

    @media (prefers-reduced-motion: no-preference) {
      .ryes-button {
        animation: ryes-pulse 2s ease-in-out infinite;
      }
    }

    @keyframes ryes-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 106, 112, 0.5);
      }

      60% {
        transform: scale(1.025);
        box-shadow: 0 0 0 10px rgba(255, 106, 112, 0);
      }
    }

    .ryes-button:hover,
    .ryes-button:focus-visible {
      animation: none;
      background: #a81020;
    }

    .ryes-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    .giveaway-note {
      margin: 0;
      color: #ffed94;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="giveaway-card">
    <h1>💰 GIVEAWAY 💰</h1>

    <p class="giveaway-message">
      Winners are being selected RIGHT NOW!<br>
      Don’t miss your chance.
    </p>

    <a class="ryes-button" href="YOUR_GIFT_LINK_HERE">
      GET MY GIFT NOW 🔥
    </a>

    <p class="giveaway-note">⚡ Only a few spots left</p>
  </main>

</body>
</html>
